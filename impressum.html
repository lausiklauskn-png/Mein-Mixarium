const LABELS = {
  de:'DE 🇩🇪', en:'EN 🇬🇧', ru:'RU 🇷🇺', zh:'ZH 🇨🇳',
  es:'ES 🇪🇸', fr:'FR 🇫🇷', it:'IT 🇮🇹', pt:'PT 🇵🇹'
};

function getLang() {
  try { return localStorage.getItem('mlang9') || 'de'; } catch(e) { return 'de'; }
}

function render(lang) {
  if (!LANGS[lang]) lang = 'de';
  const L = LANGS[lang];
  document.documentElement.lang = lang;
  document.title = L.title;
  document.getElementById('content').innerHTML =
    '<h1>' + L.title + '</h1>' +
    '<div class="section"><h2>' + L.imp_h + '</h2>' + L.imp + '</div>' +
    '<div class="section"><h2>' + L.priv_h + '</h2>' + L.priv + '</div>';
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

function buildBar() {
  const bar = document.getElementById('langBar');
  Object.keys(LABELS).forEach(l => {
    const btn = document.createElement('button');
    btn.className = 'lang-btn';
    btn.dataset.lang = l;
    btn.textContent = LABELS[l];
    btn.onclick = () => render(l);
    bar.appendChild(btn);
  });
}

buildBar();
render(getLang());
</script>
</body>
