<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- App icon rounded corners clip -->
    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>

    <!-- Glass interior clip for liquid layers -->
    <clipPath id="glassClip">
      <path d="M 215,388 L 805,388 C 805,520 695,770 605,842 L 415,842 C 330,770 215,520 215,388 Z"/>
    </clipPath>

    <!-- Rainbow background: smooth radial gradients from each corner/edge -->
    <radialGradient id="g-red" cx="0" cy="0" r="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ff1100" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#ff1100" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff1100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-orange" cx="512" cy="-160" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ff8800" stop-opacity="0.88"/>
      <stop offset="50%"  stop-color="#ff8800" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-yellow" cx="1024" cy="0" r="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ddee00" stop-opacity="0.92"/>
      <stop offset="50%"  stop-color="#ddee00" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#ddee00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-green" cx="1280" cy="512" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22dd44" stop-opacity="0.85"/>
      <stop offset="50%"  stop-color="#22dd44" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22dd44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-cyan" cx="1024" cy="1024" r="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00ccff" stop-opacity="0.90"/>
      <stop offset="50%"  stop-color="#00ccff" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#00ccff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-blue" cx="512" cy="1200" r="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1133ff" stop-opacity="0.90"/>
      <stop offset="50%"  stop-color="#1133ff" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#1133ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-teal" cx="0" cy="1024" r="920" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22aa66" stop-opacity="0.75"/>
      <stop offset="50%"  stop-color="#22aa66" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#22aa66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-ygreen" cx="-200" cy="512" r="730" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#88ff00" stop-opacity="0.70"/>
      <stop offset="50%"  stop-color="#88ff00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#88ff00" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon glow effect for white outline elements -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Softer glow for larger structural elements -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#iconClip)">

    <!-- ======================================= -->
    <!-- RAINBOW BACKGROUND (smooth gradients)   -->
    <!-- ======================================= -->
    <rect width="1024" height="1024" fill="#20bb38"/>
    <rect width="1024" height="1024" fill="url(#g-red)"/>
    <rect width="1024" height="1024" fill="url(#g-orange)"/>
    <rect width="1024" height="1024" fill="url(#g-yellow)"/>
    <rect width="1024" height="1024" fill="url(#g-green)"/>
    <rect width="1024" height="1024" fill="url(#g-cyan)"/>
    <rect width="1024" height="1024" fill="url(#g-blue)"/>
    <rect width="1024" height="1024" fill="url(#g-teal)"/>
    <rect width="1024" height="1024" fill="url(#g-ygreen)"/>

    <!-- ======================================= -->
    <!-- LIQUID LAYERS INSIDE GLASS (clipped)    -->
    <!-- ======================================= -->
    <g clip-path="url(#glassClip)">

      <!-- Blue base layer — fills entire glass interior -->
      <rect x="0" y="0" width="1024" height="1024" fill="#1155ee"/>

      <!-- Green layer — rim down to green-blue wave boundary (~y=735) -->
      <path d="M 0,388 L 1024,388 L 1024,738
               Q 770,713 510,738
               Q 250,763 0,738 Z"
            fill="#22dd44"/>

      <!-- Orange layer — rim down to orange-green wave boundary (~y=652) -->
      <path d="M 0,388 L 1024,388 L 1024,655
               Q 770,630 510,655
               Q 250,680 0,655 Z"
            fill="#ff8800"/>

      <!-- Pink/magenta layer — rim down to pink-orange wave boundary (~y=568) -->
      <path d="M 0,388 L 1024,388 L 1024,572
               Q 770,546 510,572
               Q 250,598 0,572 Z"
            fill="#ff2299"/>

      <!-- White wave boundary lines -->
      <path d="M 0,572 Q 250,546 510,572 Q 770,598 1024,572"
            stroke="white" stroke-width="4" fill="none" opacity="0.75"/>
      <path d="M 0,655 Q 250,630 510,655 Q 770,680 1024,655"
            stroke="white" stroke-width="4" fill="none" opacity="0.75"/>
      <path d="M 0,738 Q 250,713 510,738 Q 770,763 1024,738"
            stroke="white" stroke-width="4" fill="none" opacity="0.75"/>

      <!-- Bubbles inside the glass -->
      <!-- Blue section -->
      <circle cx="382" cy="790" r="20"  fill="none"  stroke="white" stroke-width="4.5" opacity="0.90"/>
      <circle cx="510" cy="805" r="9"   fill="white" opacity="0.75"/>
      <circle cx="608" cy="776" r="14"  fill="none"  stroke="white" stroke-width="4"   opacity="0.82"/>
      <!-- Green section -->
      <circle cx="422" cy="694" r="13"  fill="none"  stroke="white" stroke-width="4"   opacity="0.85"/>
      <circle cx="572" cy="706" r="8"   fill="white" opacity="0.70"/>
      <!-- Orange section -->
      <circle cx="462" cy="610" r="12"  fill="none"  stroke="white" stroke-width="3.5" opacity="0.82"/>
      <circle cx="622" cy="620" r="7"   fill="white" opacity="0.70"/>
      <circle cx="358" cy="622" r="10"  fill="none"  stroke="white" stroke-width="3.5" opacity="0.76"/>
      <!-- Pink section -->
      <circle cx="432" cy="510" r="11"  fill="none"  stroke="white" stroke-width="3.5" opacity="0.80"/>
      <circle cx="582" cy="500" r="7"   fill="white" opacity="0.72"/>
    </g>

    <!-- ======================================= -->
    <!-- GLASS OUTLINE — white neon              -->
    <!-- ======================================= -->
    <g filter="url(#softGlow)">
      <!-- Left glass wall -->
      <path d="M 215,388 C 215,520 330,770 415,842"
            fill="none" stroke="white" stroke-width="9.5" stroke-linecap="round"/>
      <!-- Right glass wall -->
      <path d="M 805,388 C 805,520 695,770 605,842"
            fill="none" stroke="white" stroke-width="9.5" stroke-linecap="round"/>
      <!-- Bowl bottom — left shoulder to left stem -->
      <line x1="415" y1="842" x2="463" y2="842"
            stroke="white" stroke-width="9.5" stroke-linecap="round"/>
      <!-- Bowl bottom — right stem to right shoulder -->
      <line x1="557" y1="842" x2="605" y2="842"
            stroke="white" stroke-width="9.5" stroke-linecap="round"/>
      <!-- Left stem vertical -->
      <line x1="463" y1="842" x2="463" y2="904"
            stroke="white" stroke-width="9.5" stroke-linecap="round"/>
      <!-- Right stem vertical -->
      <line x1="557" y1="842" x2="557" y2="904"
            stroke="white" stroke-width="9.5" stroke-linecap="round"/>
      <!-- Base ellipse -->
      <ellipse cx="510" cy="912" rx="132" ry="24"
               fill="none" stroke="white" stroke-width="9.5"/>
    </g>

    <!-- ======================================= -->
    <!-- FLOATING BUBBLES — above glass opening  -->
    <!-- ======================================= -->
    <g filter="url(#neonGlow)">
      <circle cx="390" cy="353" r="29" fill="none" stroke="white" stroke-width="4.5" opacity="0.92"/>
      <circle cx="460" cy="336" r="17" fill="none" stroke="white" stroke-width="4"   opacity="0.88"/>
      <circle cx="528" cy="349" r="11" fill="white"               opacity="0.65"/>
      <circle cx="590" cy="330" r="21" fill="none" stroke="white" stroke-width="4"   opacity="0.88"/>
      <circle cx="650" cy="351" r="15" fill="none" stroke="white" stroke-width="3.5" opacity="0.84"/>
    </g>

    <!-- ======================================= -->
    <!-- TEST TUBE / DROPPER — upper left        -->
    <!-- Center: (276,298), rotation 51°         -->
    <!-- Closed end (global): ~(185,185)         -->
    <!-- Dropper tip (global): ~(334,370)        -->
    <!-- ======================================= -->
    <g transform="translate(276,298) rotate(51)" filter="url(#softGlow)">
      <!-- Pink liquid fill inside tube -->
      <path d="M -145,-18 A 18,18 0 0 0 -145,18 L 60,18 L 60,-18 Z"
            fill="#ff44aa"/>
      <!-- Top tube wall -->
      <line x1="-145" y1="-22" x2="68" y2="-22"
            stroke="white" stroke-width="9" stroke-linecap="round"/>
      <!-- Bottom tube wall -->
      <line x1="-145" y1="22"  x2="68" y2="22"
            stroke="white" stroke-width="9" stroke-linecap="round"/>
      <!-- Sealed round end (full semicircle cap) -->
      <path d="M -145,-22 A 22,22 0 0 0 -145,22"
            stroke="white" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- Dropper taper: gradual narrowing to tip -->
      <line x1="68" y1="-22" x2="100" y2="-6"
            stroke="white" stroke-width="9" stroke-linecap="round"/>
      <line x1="68" y1="22"  x2="100" y2="6"
            stroke="white" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- Drop of liquid falling from dropper tip -->
    <!-- Tip global position: (276+100·cos51°, 298+100·sin51°) ≈ (339, 375) -->
    <g filter="url(#neonGlow)">
      <ellipse cx="353" cy="416" rx="11" ry="14" fill="#ff44aa"/>
      <path d="M 353,402 L 345,384 L 361,384 Z"  fill="#ff44aa"/>
      <ellipse cx="353" cy="416" rx="11" ry="14"
               fill="none" stroke="white" stroke-width="3"/>
      <path d="M 353,402 L 345,384 L 361,384 Z"
            fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- ======================================= -->
    <!-- STRAW — upper right                     -->
    <!-- From inside glass (~695,500) up-right   -->
    <!-- to bent tip (~748,198) → (764,190)      -->
    <!-- ======================================= -->
    <g filter="url(#neonGlow)">
      <path d="M 692,510 L 748,200 L 764,190"
            fill="none" stroke="white" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ======================================= -->
    <!-- SPARKLE STARS — 4-pointed               -->
    <!-- M cx,cy-R  L cx+r,cy-r  L cx+R,cy      -->
    <!-- L cx+r,cy+r  L cx,cy+R  L cx-r,cy+r    -->
    <!-- L cx-R,cy  L cx-r,cy-r  Z               -->
    <!-- ======================================= -->
    <g filter="url(#softGlow)" fill="white">
      <!-- Large sparkle — (~390, 278), outer R=33, inner r=6 -->
      <path d="M 390,245 L 396,272 L 423,278 L 396,284 L 390,311
               L 384,284 L 357,278 L 384,272 Z"/>

      <!-- Medium sparkle — (~548, 240), outer R=21, inner r=4 -->
      <path d="M 548,219 L 552,236 L 569,240 L 552,244 L 548,261
               L 544,244 L 527,240 L 544,236 Z"/>

      <!-- Small sparkle — right (~737, 308), outer R=13, inner r=3 -->
      <path d="M 737,295 L 740,305 L 750,308 L 740,311 L 737,321
               L 734,311 L 724,308 L 734,305 Z"/>
    </g>

  </g>
</svg>
